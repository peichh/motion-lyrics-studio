<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyrics Motion Studio</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Instrument+Serif&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#111827;font:13px Inter,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid #dbe2ea;background:white;border-radius:8px;padding:8px;cursor:pointer}button.primary{background:#111827;color:white}.top{height:58px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ddd}.song{position:absolute;left:50%;transform:translateX(-50%);font-weight:700;color:#475569;max-width:35vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px;align-items:center}.shell{height:calc(100vh - 200px);min-height:420px;display:grid;grid-template-columns:280px 1fr 240px;background:#e2e8f0;gap:1px}.side{background:white;padding:12px;overflow:auto}.stage{background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:8px;min-width:0}.canvasbox{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.canvas{width:min(100%,850px);aspect-ratio:16/9;max-height:100%;background:#111827}.canvas.r916,.canvas.r11{height:min(100%,500px);width:auto}.canvas.r916{aspect-ratio:9/16}.canvas.r11{aspect-ratio:1}.canvas canvas{width:100%;height:100%;display:block}.transport{width:min(100%,850px);display:flex;align-items:center;gap:8px}.transport input[type=range]{flex:1}.row{display:flex;align-items:center;gap:6px;margin:9px 0}.row label{flex:1}.heading{font-weight:700;color:#64748b;font-size:11px;margin:8px 0}.templates{display:grid;grid-template-columns:1fr 1fr;gap:5px}.template{font-size:10px;text-align:left;min-height:52px}.template.active{outline:2px solid #4f46e5;background:#eef2ff}.hidden{display:none}.menu{position:absolute;right:125px;top:48px;background:white;box-shadow:0 8px 28px #0002;padding:7px;border-radius:10px;z-index:10;display:grid;gap:4px}.timeline{height:140px;background:white;padding:10px 14px}.track{height:85px;position:relative;overflow:auto;margin-top:7px;background:repeating-linear-gradient(90deg,#f8fafc 0 99px,#e2e8f0 100px);border:1px solid #ddd}.wave{height:100%;position:relative}.block{position:absolute;top:5px;height:24px;background:#e0e7ff;border:1px solid #818cf8;border-radius:4px;overflow:hidden;white-space:nowrap;font-size:9px;padding:5px}.word{position:absolute;top:38px;height:26px;background:#fef3c7;border:1px solid #f59e0b;overflow:hidden;white-space:nowrap;font-size:9px;padding:5px}.head{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;pointer-events:none;z-index:2}@media(max-width:900px){.shell{grid-template-columns:240px 1fr}.right{display:none}}@media(max-width:620px){.shell{display:flex;flex-direction:column;height:auto}.stage{min-height:360px}.side{max-height:300px}.song{display:none}}</style></head><body><header class="top"><b>Lyrics Motion Studio</b><span id="song" class="song">♫ &nbsp; No Audio Loaded</span><div class="actions"><button data-r="r169">16:9</button><button data-r="r916">9:16</button><button data-r="r11">1:1</button><button id="upload" class="primary">Upload / Import ▾</button><button id="export">Export</button></div><div id="menu" class="menu hidden"><button id="pickAudio">Upload Audio (.mp3, .wav)</button><button id="pickLrc">Upload Lyrics (.lrc, .txt)</button><button id="pickBg">Upload Background (Image / Video)</button></div><input hidden id="audioFile" type="file" accept="audio/*"><input hidden id="lrcFile" type="file" accept=".lrc,.txt,text/plain"><input hidden id="bgFile" type="file" accept="image/*,video/*"></header><main class="shell"><aside class="side"><div class="heading">Kinetic templates · 19 styles</div><div id="templates" class="templates"></div><div class="heading">Lyrics · Enhanced LRC</div><textarea id="lrc" style="width:100%;height:90px"></textarea><button id="parse">Parse Lyrics</button><div id="lines"></div><div class="row"><label>Offset ms</label><input id="offset" type="number" value="0"></div></aside><section class="stage"><div class="canvasbox"><div class="canvas" id="canvas"><canvas id="visual"></canvas></div></div><div class="transport"><button id="play" class="primary">▶</button><span id="clock">00:00 / 00:00</span><input id="seek" type="range" min="0" max="1000" value="0"><button id="mute">🔊</button></div></section><aside class="side right"><div class="heading">Style controls</div><label>Font <select id="font"><option>Inter</option><option>Instrument Serif</option><option>JetBrains Mono</option></select></label><div class="row"><label>Size</label><input id="size" type="range" min="20" max="100" value="58"></div><div class="row"><label>Text</label><input id="color" type="color" value="#ffffff"><label>Accent</label><input id="accent" type="color" value="#facc15"></div><div class="row"><label>Background</label><input id="bg" type="color" value="#111827"></div></aside></main><section class="timeline"><b>Timeline</b><div id="track" class="track"><div id="wave" class="wave"><div id="head" class="head"></div></div></div></section><audio id="audio" preload="metadata"></audio><script>(()=>{'use strict';const $=id=>document.getElementById(id),a=$('audio'),canvas=$('canvas'),cv=$('visual'),cx=cv.getContext('2d'),track=$('track'),wave=$('wave');let lines=[],duration=60,offset=0,template=0,image=null,bgVideo=null,raf=0,recording=null;const presets=['TikTok Kinetic Stomp','Minimalist Editorial / Spotify','Karaoke Glow / Neon Bar','Clean Pop & Float','Cyberpunk / Glitch Shift','Elegant Serif / Cinematic','3D Orbiting Cylinder','3D Camera Fly-through','3D Isometric Floating','3D Card Flip / Tilt','3D Spatial Tunnel','3D Extruded Type','3D Perspective Warp','3D Depth Zoom','3D Floating Space','3D Isometric Roll','3D Camera Orbit','3D Prism Refraction','3D Z-Drop'];const palettes=['#facc15','#c4b5fd','#67e8f9','#f9a8d4','#22d3ee','#e6c783','#60a5fa','#a78bfa','#2dd4bf','#f472b6','#22d3ee','#fb7185','#fbbf24','#c4b5fd','#f0abfc','#34d399','#38bdf8','#f0abfc','#fbbf24'];presets.forEach((name,i)=>{const b=document.createElement('button');b.className='template';b.textContent=name;b.onclick=()=>{template=i;document.querySelectorAll('.template').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('accent').value=palettes[i]};$('templates').append(b)});document.querySelector('.template').classList.add('active');const sample='[00:00.00]<00:00.00>Welcome <00:01.00>to <00:01.40>Lyrics <00:02.00>Motion';$('lrc').value=sample;function parse(text){const result=[];for(const row of text.split(/\r?\n/)){const m=row.match(/^\[(\d+):(\d{2}(?:\.\d+)?)\](.*)$/);if(!m)continue;const start=+m[1]*60 + +m[2],re=/<(\d+):(\d{2}(?:\.\d+)?)>([^<]*)/g;let q,words=[];while((q=re.exec(m[3]))){const text=q[3].trim();if(text)words.push({text,t:+q[1]*60 + +q[2]})}if(!words.length&&m[3].trim())words.push({text:m[3].trim(),t:start});result.push({start,words,end:0})}result.sort((x,y)=>x.start-y.start);result.forEach((l,i)=>l.end=result[i+1]?.start||l.start+4);lines=result;duration=Math.max(a.duration||0,...lines.map(l=>l.end),10);renderLineList();layout();draw()}function renderLineList(){const root=$('lines');root.replaceChildren();lines.forEach((l,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+l.words.map(w=>w.text).join(' ');d.style.padding='4px';d.onclick=()=>{a.currentTime=l.start;};root.append(d)})}function layout(){duration=Math.max(duration,a.duration||0,10);wave.style.width=Math.max(track.clientWidth,duration*100)+'px';wave.querySelectorAll('.block,.word').forEach(e=>e.remove());lines.forEach(l=>{const b=document.createElement('div');b.className='block';b.textContent=l.words.map(w=>w.text).join(' ');b.style.left=l.start*100+'px';b.style.width=Math.max(30,(l.end-l.start)*100-2)+'px';b.onclick=()=>a.currentTime=l.start;wave.append(b);l.words.forEach((w,i)=>{const e=document.createElement('div');e.className='word';e.textContent=w.text;e.style.left=w.t*100+'px';e.style.width=Math.max(20,((l.words[i+1]?.t||l.end)-w.t)*100-2)+'px';wave.append(e)})})}function render(){try{const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h){const dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);cx.fillStyle=$('bg').value;cx.fillRect(0,0,w,h);if(bgVideo?.readyState>=2)drawCover(bgVideo,w,h);else if(image?.complete)drawCover(image,w,h);const t=a.currentTime-offset/1000,l=lines.find(x=>t>=x.start&&t<x.end);if(l){const active=palettes[template]||$('accent').value;text(l.words.map(x=>x.text).join(' '),w/2,h/2,+$('size').value,$('font').value,active)} }const current=Number.isFinite(a.currentTime)?a.currentTime:0;$('head').style.left=current*100+'px';$('clock').textContent=fmt(current)+' / '+fmt(duration);$('seek').value=duration?current/duration*1000:0;if(!a.paused&&current*100>track.scrollLeft+track.clientWidth*.75)track.scrollLeft=current*100-track.clientWidth*.5}catch(err){console.error('Preview render error',err)}raf=requestAnimationFrame(render)}function text(value,x,y,size,font,color){cx.save();cx.font=`700 ${size}px "${font}",sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.shadowColor=color;cx.shadowBlur=14;cx.fillStyle=color;const max=canvas.clientWidth-40;if(cx.measureText(value).width>max){let words=value.split(' '),rows=[],row='';words.forEach(w=>{if(cx.measureText(row+' '+w).width>max&&row){rows.push(row);row=w}else row+=(row?' ':'')+w});if(row)rows.push(row);rows.forEach((r,i)=>cx.fillText(r,x,y+(i-(rows.length-1)/2)*(size*1.2)))}else cx.fillText(value,x,y);cx.restore()}function drawCover(src,w,h){const sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight;if(!sw||!sh)return;const scale=Math.max(w/sw,h/sh);cx.drawImage(src,(w-sw*scale)/2,(h-sh*scale)/2,sw*scale,sh*scale)}function fmt(v){return `${String(Math.floor(v/60)).padStart(2,'0')}:${(v%60).toFixed(2).padStart(5,'0')}`}function loadLrc(file){file.text().then(t=>{$('lrc').value=t;parse(t)}).catch(console.error)}$('upload').onclick=()=> $('menu').classList.toggle('hidden');document.addEventListener('click',e=>{if(!e.target.closest('#upload')&&!e.target.closest('#menu'))$('menu').classList.add('hidden')});$('pickAudio').onclick=()=>$('audioFile').click();$('pickLrc').onclick=()=>$('lrcFile').click();$('pickBg').onclick=()=>$('bgFile').click();$('audioFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;a.pause();a.src=URL.createObjectURL(f);$('song').textContent='♫  '+f.name;a.load();a.onloadedmetadata=()=>{duration=Math.max(a.duration,...lines.map(l=>l.end),10);layout()};a.onerror=()=>console.error('Audio load error',a.error)};$('lrcFile').onchange=e=>{const f=e.target.files?.[0];if(f)loadLrc(f)};$('parse').onclick=()=>parse($('lrc').value);$('bgFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const url=URL.createObjectURL(f);if(f.type.startsWith('video')){bgVideo=document.createElement('video');bgVideo.src=url;bgVideo.loop=true;bgVideo.muted=true;bgVideo.playsInline=true;bgVideo.play().catch(()=>{});image=null}else{image=new Image();image.onload=draw;image.src=url;bgVideo=null}};$('play').onclick=async()=>{if(a.paused){try{await a.play()}catch(e){console.warn('Playback could not start',e)}}else a.pause()};a.addEventListener('timeupdate',()=>{if(!raf)raf=requestAnimationFrame(render)});$('seek').oninput=e=>{if(Number.isFinite(a.duration))a.currentTime=(+e.target.value/1000)*a.duration};$('mute').onclick=()=>{a.muted=!a.muted;$('mute').textContent=a.muted?'🔇':'🔊'};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>canvas.className='canvas '+b.dataset.r);$('offset').oninput=e=>{offset=+e.target.value||0};$('font').onchange=draw;$('size').oninput=draw;$('color').oninput=draw;$('bg').oninput=draw;window.addEventListener('resize',layout);$('export').onclick=()=>{if(recording){recording.stop();recording=null;return}if(!cv.captureStream||!window.MediaRecorder)return alert('Video export is not supported in this browser');recording=new MediaRecorder(cv.captureStream(30));const parts=[];recording.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recording.onstop=()=>{const url=URL.createObjectURL(new Blob(parts,{type:recording.mimeType||'video/webm'})),link=document.createElement('a');link.href=url;link.download='lyrics-motion.webm';link.click()};recording.start();a.play().catch(console.warn)};parse(sample);layout();if(!raf)raf=requestAnimationFrame(render)})();</script></body></html>
