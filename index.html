<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Lyrics Studio</title><style>
:root{--bg:#0b0c10;--panel:#111218;--line:#262832;--gold:#d4af37;--muted:#8c8e9a;--white:#f4f2ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:13px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{background:#1b1d25;border:1px solid var(--line);border-radius:6px;padding:8px 11px;cursor:pointer}button:hover,button.active{border-color:var(--gold);color:var(--gold)}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101116;gap:12px}.title{font-weight:700;letter-spacing:.1em;color:var(--gold)}.controls,.ratios{display:flex;gap:6px;align-items:center}.layout{display:grid;grid-template-columns:310px 1fr 270px;height:calc(100vh - 58px - 185px);min-height:420px}.panel{background:var(--panel);overflow:auto;padding:14px;border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);border-right:0}.section{margin:0 0 18px}.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{flex:1;color:#c1c1c7}.row input[type=range]{width:110px;accent-color:var(--gold)}input,textarea,select{background:#0c0d12;border:1px solid var(--line);border-radius:5px;padding:7px;min-width:0}input[type=number]{width:78px}.lyric{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}.lyric.selected{background:#242116;border-left:2px solid var(--gold)}.lyric textarea{width:100%;resize:vertical}.lyric small{color:var(--muted)}.workspace{display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#171821,#0c0d11 70%);overflow:hidden}.canvas{position:relative;background:linear-gradient(135deg,#17202c,#090a11);width:min(90%,850px);aspect-ratio:16/9;max-height:90%;overflow:hidden;box-shadow:0 20px 60px #0009}.canvas.r916{aspect-ratio:9/16;width:auto;height:min(90%,570px)}.canvas.r11{aspect-ratio:1;width:auto;height:min(90%,620px)}.canvas.r45{aspect-ratio:4/5;width:auto;height:min(90%,620px)}#visual{width:100%;height:100%;display:block}.dragtext{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:move;touch-action:none;white-space:pre-wrap;text-align:center;max-width:90%;font-weight:800;text-shadow:0 3px 24px #000;user-select:none}.dragtext.focus{outline:1px dashed var(--gold);outline-offset:12px}.timeline{height:185px;background:#101116;border-top:1px solid var(--line);padding:12px 16px}.timehead{display:flex;justify-content:space-between;align-items:center}.track{height:70px;position:relative;margin-top:12px;background:repeating-linear-gradient(90deg,#1b1d24 0 1px,transparent 1px 50px);border:1px solid var(--line);overflow:hidden}.block{position:absolute;top:14px;height:40px;background:#342b12;border:1px solid var(--gold);border-radius:4px;overflow:hidden;white-space:nowrap;padding:10px 6px;cursor:pointer;font-size:11px}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff6464;pointer-events:none}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tab{font-size:11px;padding:6px}.preset{display:flex;flex-wrap:wrap;gap:5px}.preset button{font-size:11px;padding:6px}.export{background:var(--gold);color:#17140a;font-weight:800;border-color:var(--gold)}@media(max-width:900px){.layout{grid-template-columns:250px 1fr;height:calc(100vh - 58px - 185px)}.right{display:none}.title{font-size:10px}}@media(max-width:650px){header{flex-wrap:wrap;height:auto;padding:8px}.layout{display:flex;flex-direction:column;height:auto}.panel.left{max-height:240px}.workspace{min-height:360px}.timeline{height:180px}}
</style></head><body><header><div class="title">LYRICS STUDIO / MOTION WORKSPACE</div><div class="controls"><button id="play">▶</button><button id="rewind">↶</button><button id="forward">↷</button><button id="loop" class="active">↻</button><span id="clock">00:00.00 / 00:00.00</span></div><div class="ratios"><button data-r="r169" class="active">16:9</button><button data-r="r916">9:16</button><button data-r="r11">1:1</button><button data-r="r45">4:5</button><select id="resolution"><option>1080p</option><option>4K</option></select><button class="export" id="export">Export WebM</button></div></header><main class="layout"><aside class="panel left"><div class="section"><h3>Audio & Media</h3><input id="audioFile" type="file" accept="audio/*"><div class="row"><button id="addLine">＋ Add lyric</button><button id="uploadBg">＋ Background</button><input id="bgFile" type="file" accept="image/*,video/*" hidden></div><div id="audioStatus" class="muted"></div><div class="row"><label>Global delay (ms)</label><button id="delayMinus">−</button><input type="number" id="offset" value="0" step="100"><button id="delayPlus">＋</button></div><div class="row"><button id="lineMode" class="active">Line mode</button><button id="wordMode">Word mode</button></div></div><section class="section"><h3>Lyrics & sync grid</h3><div id="lyrics"></div></section></aside><section class="workspace"><div class="canvas" id="canvas"><canvas id="visual"></canvas><div class="dragtext focus" id="lyricText">Drop audio and add lyrics</div></div></section><aside class="panel right"><div class="section"><h3>Inspector</h3><div class="row"><label>Text</label><input id="textEdit"></div><div class="row"><label>Font size</label><input id="fontSize" type="range" min="18" max="120" value="58"></div><div class="row"><label>Color</label><input id="color" type="color" value="#f4f2ec"></div><div class="row"><label>Rotation</label><input id="rotation" type="range" min="-180" max="180" value="0"></div><div class="row"><label>Letter spacing</label><input id="spacing" type="range" min="-2" max="20" value="0"></div><div class="row"><label>Glow</label><input id="glow" type="range" min="0" max="50" value="18"></div><div class="row"><label>Motion duration</label><input id="duration" type="range" min="100" max="2000" value="500"></div><h3>Text presets</h3><div class="preset" id="textPresets"></div><h3 style="margin-top:14px">Animation presets</h3><div class="preset" id="motionPresets"></div><h3 style="margin-top:14px">Background presets</h3><div class="preset" id="bgPresets"></div></div></aside></main><section class="timeline"><div class="timehead"><div><b>PRO TIMELINE</b> <span id="modeLabel">Line level</span></div><div class="row" style="margin:0"><button id="zoomOut">−</button><input id="zoom" type="range" min="1" max="12" value="3"><button id="zoomIn">＋</button><span id="zoomLabel">3×</span></div></div><div class="track" id="track"><div class="playhead" id="playhead"></div></div><audio id="audio" hidden></audio></section><video id="bgVideo" muted loop playsinline style="display:none"></video><script>
const $=s=>document.querySelector(s), lyricsEl=$('#lyrics'), audio=$('#audio'), canvas=$('#canvas'), text=$('#lyricText'), track=$('#track'), playhead=$('#playhead');let lines=[{text:'Your mood, your moment',start:0,end:4,x:50,y:50,preset:'Fade Up'}],selected=0,mode='line',duration=60,zoom=3,playing=false,bg=null,bgKind='',anim='Fade Up',bgPreset='Starlight',drag=null,loop=true;const ctx=$('#visual').getContext('2d');
function activeLine(){let t=audio.currentTime-(+$('#offset').value/1000);return lines.findIndex(l=>t>=l.start&&t<l.end)}function draw(){let dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if($('#visual').width!==w*dpr||$('#visual').height!==h*dpr){$('#visual').width=w*dpr;$('#visual').height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);let g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,bgPreset==='Cyber City'?'#101c35':'#182333');g.addColorStop(1,bgPreset==='Starlight'?'#080910':'#090a11');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(bg&&bgKind==='image')ctx.drawImage(bg,0,0,w,h);if(bgKind==='video'&&bg?.readyState>=2)ctx.drawImage(bg,0,0,w,h);if(bgPreset==='Particles'){for(let i=0;i<65;i++){let x=(i*137.51+performance.now()*.012)%w,y=(i*89.7)%h;ctx.fillStyle='rgba(212,175,55,.6)';ctx.fillRect(x,y,2,2)}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function render(){lyricsEl.innerHTML='';lines.forEach((l,i)=>{let row=document.createElement('div');row.className='lyric '+(i===selected?'selected':'');row.innerHTML=`<small>${String(i+1).padStart(2,'0')}<br><span>${l.start.toFixed(2)}s</span></small><div><textarea rows="2"></textarea><div class="row"><input aria-label="start" type="number" step=".01" value="${l.start}"><input aria-label="end" type="number" step=".01" value="${l.end}"><button>Sync</button></div></div>`;let ta=row.querySelector('textarea');ta.value=l.text;ta.oninput=()=>{l.text=ta.value;sync()};let nums=row.querySelectorAll('input');nums[0].onchange=()=>{l.start=+nums[0].value;render()};nums[1].onchange=()=>{l.end=+nums[1].value;render()};row.querySelector('button').onclick=()=>{l.start=audio.currentTime-(+$('#offset').value/1000);l.end=l.start+2;render()};row.onclick=()=>{selected=i;audio.currentTime=Math.max(0,l.start+(+$('#offset').value/1000));render()};lyricsEl.append(row)});timeline();sync()}
function timeline(){track.querySelectorAll('.block').forEach(x=>x.remove());let total=Math.max(duration,...lines.map(l=>l.end),1),width=track.clientWidth*zoom;lines.forEach((l,i)=>{let b=document.createElement('div');b.className='block';b.style.left=(l.start/total*width)+'px';b.style.width=Math.max(48,(l.end-l.start)/total*width)+'px';b.textContent=l.text;b.style.borderColor=i===selected?'#f5dc67':'#d4af37';b.onclick=e=>{e.stopPropagation();selected=i;render()};track.append(b)});let t=audio.currentTime/Math.max(duration,1)*width;playhead.style.left=t+'px';$('#zoomLabel').textContent=zoom+'×'}function sync(){let i=activeLine();if(i>=0&&i!==selected){selected=i;render()}let l=lines[selected];if(l){text.textContent=l.text;text.style.left=l.x+'%';text.style.top=l.y+'%';text.style.color=$('#color').value;text.style.fontSize=$('#fontSize').value+'px';text.style.letterSpacing=$('#spacing').value+'px';text.style.textShadow=`0 0 ${$('#glow').value}px ${$('#color').value}`;let p=(audio.currentTime-l.start)/(+$('#duration').value/1000);text.style.opacity=anim==='Fade Up'?Math.min(1,Math.max(.25,p*2)):1;text.style.transform=`translate(-50%,-50%) rotate(${$('#rotation').value}deg) scale(${anim==='Pop'?1+Math.max(0,1-p)*.12:1})`;text.classList.toggle('focus',document.activeElement===text||!playing)}$('#clock').textContent=`${fmt(audio.currentTime)} / ${fmt(duration)}`;timeline()}
function fmt(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`}function choose(i){selected=Math.max(0,Math.min(lines.length-1,i));render()}
$('#addLine').onclick=()=>{let start=lines.at(-1)?.end||0;lines.push({text:'New lyric line',start,end:start+3,x:50,y:50,preset:anim});choose(lines.length-1)};$('#audioFile').onchange=e=>{let f=e.target.files[0];if(f){audio.src=URL.createObjectURL(f);audio.onloadedmetadata=()=>{duration=audio.duration;$('#audioStatus').textContent=f.name;render()}}};$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>{$('#play').textContent='❚❚';playing=true};audio.onpause=()=>{$('#play').textContent='▶';playing=false};audio.ontimeupdate=sync;audio.onended=()=>{if(loop){audio.currentTime=0;audio.play()}};$('#rewind').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('#forward').onclick=()=>audio.currentTime=Math.min(duration,audio.currentTime+5);$('#loop').onclick=e=>{loop=!loop;e.currentTarget.classList.toggle('active',loop)};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');canvas.className='canvas '+(b.dataset.r==='r169'?'':b.dataset.r)});$('#offset').onchange=()=>{audio.currentTime=Math.max(0,(audio.currentTime-(+$('#offset').value/1000)));sync()};$('#delayMinus').onclick=()=>{$('#offset').value=+$('#offset').value-100;sync()};$('#delayPlus').onclick=()=>{$('#offset').value=+$('#offset').value+100;sync()};$('#lineMode').onclick=()=>setMode('line');$('#wordMode').onclick=()=>setMode('word');function setMode(m){mode=m;$('#lineMode').classList.toggle('active',m==='line');$('#wordMode').classList.toggle('active',m==='word');$('#modeLabel').textContent=m==='line'?'Line level':'Word level';if(m==='word'){lines=lines.flatMap(l=>{let words=l.text.split(/\s+/),step=(l.end-l.start)/words.length;return words.map((word,i)=>({...l,text:word,start:l.start+i*step,end:l.start+(i+1)*step}))})}render()}
text.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,l:lines[selected].x,t:lines[selected].y};text.setPointerCapture(e.pointerId)};text.onpointermove=e=>{if(!drag)return;let r=canvas.getBoundingClientRect(),l=lines[selected];l.x=Math.min(95,Math.max(5,drag.l+(e.clientX-drag.x)/r.width*100));l.y=Math.min(95,Math.max(5,drag.t+(e.clientY-drag.y)/r.height*100));sync()};text.onpointerup=()=>drag=null;text.ondblclick=()=>{text.contentEditable=true;text.focus()};text.onblur=()=>{text.contentEditable=false;if(lines[selected]){lines[selected].text=text.textContent;render()}};
track.onpointerdown=e=>{if(e.target.classList.contains('block'))return;let r=track.getBoundingClientRect(),total=Math.max(duration,...lines.map(l=>l.end),1);audio.currentTime=Math.max(0,Math.min(duration,(e.clientX-r.left)/(r.width*zoom)*total));track.setPointerCapture(e.pointerId)};track.onpointermove=e=>{if(e.buttons){let r=track.getBoundingClientRect(),total=Math.max(duration,...lines.map(l=>l.end),1);audio.currentTime=Math.max(0,Math.min(duration,(e.clientX-r.left)/(r.width*zoom)*total))}};$('#zoom').oninput=e=>{zoom=+e.target.value;timeline()};$('#zoomIn').onclick=()=>{$('#zoom').value=zoom=Math.min(12,zoom+1);timeline()};$('#zoomOut').onclick=()=>{$('#zoom').value=zoom=Math.max(1,zoom-1);timeline()};
[['fontSize','input'],['color','input'],['rotation','input'],['spacing','input'],['glow','input'],['duration','input']].forEach(([id,ev])=>$('#'+id).addEventListener(ev,sync));$('#textEdit').oninput=e=>{if(lines[selected]){lines[selected].text=e.target.value;render()}};function presets(id,names,fn){let el=$('#'+id);names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{fn(n);el.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');sync()};el.append(b)})}presets('textPresets',['Typography','Karaoke','Pop','Fade','Slide','Typewriter'],n=>{anim=n==='Typography'?'None':n});presets('motionPresets',['Fade Up','Pop','Drift','Glitch','3D Warp','Slide'],n=>anim=n);presets('bgPresets',['Gradient','Particles','Cyber City','Starlight'],n=>{bgPreset=n});$('#uploadBg').onclick=()=>$('#bgFile').click();$('#bgFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);if(f.type.startsWith('video')){bg=$('#bgVideo');bg.src=u;bg.play();bgKind='video'}else{bg=new Image();bg.onload=sync;bg.src=u;bgKind='image'}};
$('#export').onclick=async()=>{let stream=$('#visual').captureStream(30);if(audio.src&&audio.captureStream){let astream=audio.captureStream();astream.getAudioTracks().forEach(t=>stream.addTrack(t))}let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';let rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='motion-lyrics-studio.webm';a.click()};rec.start();if(audio.src){audio.currentTime=0;await audio.play()}setTimeout(()=>rec.stop(),Math.max(1000,(duration-audio.currentTime)*1000));alert('Recording started. Keep this tab open until the export downloads.')};
track.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoom=Math.max(1,Math.min(12,zoom+(e.deltaY<0?1:-1)));$('#zoom').value=zoom;timeline()}},{passive:false});render();</script></body></html>
