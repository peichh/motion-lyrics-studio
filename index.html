sreader'],['Karaoke Glow','karaoke','Inter'],['Pop & Float','float','Syne'],['Cyberpunk Glitch','glitch','JetBrains Mono'],['Cinematic Serif','cinema','Instrument Serif'],['3D Orbiting Cylinder','orbit','Syne'],['3D Camera Fly-through','fly','Space Grotesk'],['3D Isometric Floating','iso','Outfit'],['3D Card Flip','flip','Outfit'],['3D Spatial Tunnel','tunnel','Space Grotesk'],['3D Extruded Type','extrude','Syne'],['3D Perspective Warp','warp','Prompt'],['3D Depth Zoom','zoom','Inter'],['3D Floating Space','space','Newsreader'],['3D Isometric Roll','iso','JetBrains Mono'],['3D Camera Orbit','orbit','Inter'],['3D Prism Refraction','prism','Prompt'],['3D Z-Drop','zdrop','Prompt']].map(([name,fx,font])=>({name,fx,font})),colors=['#facc15','#c4b5fd','#67e8f9','#f9a8d4','#22d3ee','#e6c783','#60a5fa','#a78bfa','#2dd4bf','#f472b6','#22d3ee','#fb7185','#fbbf24','#c4b5fd','#f0abfc','#34d399','#38bdf8','#f0abfc','#fbbf24'],fonts=['Inter','Instrument Serif','Newsreader','JetBrains Mono','Syne','Outfit','Space Grotesk','Prompt','Sarabun','Kanit','IBM Plex Sans Thai'];function persist(){try{localStorage.setItem('motion-studio-project-v2',JSON.stringify({lyrics:$('lrc').value,selected:sel,fontName,size:$('size').value,color:$('color').value,accent:$('accent').value,bg:$('bg').value,box,align:box.align}))}catch(e){console.warn('Project autosave unavailable',e)}}function restore(){try{const p=JSON.parse(localStorage.getItem('motion-studio-project-v2')||'null');if(!p)return;$('lrc').value=p.lyrics||$('lrc').value;sel=Math.max(0,Math.min(defs.length-1,Number(p.selected)||0));fontName=fonts.includes(p.fontName)?p.fontName:'Inter';$('size').value=p.size||58;$('color').value=p.color||'#ffffff';$('accent').value=p.accent||colors[sel];$('bg').value=p.bg||'#101017';box=p.box||box;box.align=p.align||box.align;$('boxX').value=box.x;$('boxY').value=box.y;$('align').value=box.align}catch(e){console.warn('Could not restore saved project',e)}}function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,w,h);if(bgImage?.complete){const s=Math.max(w/bgImage.width,h/bgImage.height);ctx.drawImage(bgImage,(w-bgImage.width*s)/2,(h-bgImage.height*s)/2,bgImage.width*s,bgImage.height*s)}if(bgVideo?.readyState>=2){const s=Math.max(w/bgVideo.videoWidth,h/bgVideo.videoHeight);ctx.drawImage(bgVideo,(w-bgVideo.videoWidth*s)/2,(h-bgVideo.videoHeight*s)/2,bgVideo.videoWidth*s,bgVideo.videoHeight*s)}const now=audio.currentTime||0,ix=lines.findIndex(l=>now>=l.start&&now<l.end),p=defs[sel];if(ix<0)return;const line=lines[ix],words=line.words||[],fontSize=Number($('size').value)||58,color=colors[sel]||$('accent').value,px=w*box.x/100,py=h*box.y/100;ctx.font=`700 ${fontSize}px "${fontName}",sans-serif`;ctx.textAlign=box.align;ctx.textBaseline='middle';const text=words.map(v=>v.text).join(' '),elapsed=Math.max(0,now-line.start),progress=Math.min(1,elapsed/.7),ease=1-Math.pow(1-progress,3);let y=py,scale=1,alpha=1;if(p.fx==='stomp'){scale=.82+.18*(1+Math.exp(-6*elapsed)*Math.cos(13*elapsed));alpha=Math.min(1,elapsed*4)}if(p.fx==='float')y+=18*(1-ease)+Math.sin(now*2)*3;if(p.fx==='fly'||p.fx==='zoom'){scale=.58+.42*ease;alpha=Math.min(1,elapsed*2.5)}if(p.fx==='flip')scale=.75+.25*ease;if(p.fx==='iso')y+=Math.sin(now*1.2)*7;ctx.save();ctx.globalAlpha=alpha;ctx.translate(px,y);ctx.scale(scale,scale);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=p.fx==='glitch'?4:10;if(p.fx==='glitch'){ctx.fillStyle='#ff405d';ctx.fillText(text,-3,0,w-30);ctx.fillStyle='#23d9ff';ctx.fillText(text,3,0,w-30)}if(p.fx==='karaoke'){ctx.fillStyle=$('color').value;ctx.fillText(text,0,0,w-30);ctx.beginPath();ctx.rect(-w/2,-fontSize,w*Math.min(1,elapsed/2),fontSize*2);ctx.clip();ctx.fillStyle=color;ctx.fillText(text,0,0,w-30)}else{ctx.fillStyle=color;ctx.fillText(text,0,0,w-30)}ctx.restore()}function safeDraw(){try{draw()}catch(e){console.error('Preview error; plain-text fallback',e);try{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,cv.width,cv.height);const l=lines.find(v=>(audio.currentTime||0)>=v.start&&(audio.currentTime||0)<v.end);if(l){ctx.fillStyle='#fff';ctx.font='48px Inter';ctx.textAlign='center';ctx.fillText(l.words.map(q=>q.text).join(' '),cv.width/2,cv.height/2)}}catch(err){console.error(err)}}}function loop(){try{safeDraw();const t=Number.isFinite(audio.currentTime)?audio.currentTime:0;$('clock').textContent=fmt(t)+' / '+fmt(duration);$('seek').value=duration?t/duration*1000:0;$('head').style.left=t*100+'px'}finally{requestAnimationFrame(loop)}}function fmt(v){return `${String(Math.floor(v/60)).padStart(2,'0')}:${(v%60).toFixed(2).padStart(5,'0')}`}function layout(){duration=Math.max(duration,Number.isFinite(audio.duration)?audio.duration:0,10);wave.style.width=Math.max($('track').clientWidth,duration*100)+'px';wave.querySelectorAll('.block').forEach(e=>e.remove());lines.forEach(l=>{const d=document.createElement('div');d.className='block';d.textContent=l.words.map(x=>x.text).join(' ');d.style.left=l.start*100+'px';d.style.width=Math.max(40,(l.end-l.start)*100)+'px';wave.append(d)})}function parse(src){const out=[];for(const row of src.split(/\r?\n/)){const m=row.match(/^\[(\d+):(\d{2}(?:\.\d+)?)\](.*)$/);if(!m)continue;const start=+m[1]*60+ +m[2],re=/<(\d+):(\d{2}(?:\.\d+)?)>([^<]*)/g;let q,words=[];while((q=re.exec(m[3])))if(q[3].trim())words.push({text:q[3].trim(),t:+q[1]*60+ +q[2]});if(!words.length&&m[3].trim())words=[{text:m[3].trim(),t:start}];out.push({start,words,end:0})}out.sort((a,b)=>a.start-b.start);out.forEach((l,i)=>l.end=out[i+1]?.start||l.start+4);lines=out;$('lines').replaceChildren(...lines.map(l=>{const d=document.createElement('div');d.className='lyric';const ta=document.createElement('textarea');ta.value=l.words.map(w=>w.text).join(' ');ta.oninput=()=>{l.words=[{text:ta.value,t:l.start}];persist();safeDraw()};d.textContent=`[${fmt(l.start)}] `;d.append(ta);d.onclick=()=>audio.currentTime=l.start;return d}));duration=Math.max(10,Number.isFinite(audio.duration)?audio.duration:0,...lines.map(l=>l.end));layout();persist();safeDraw()}function bars(buffer){const root=$('waveBars');root.replaceChildren();if(!buffer)return;const data=buffer.getChannelData(0),n=100,size=Math.max(1,Math.floor(data.length/n));for(let i=0;i<n;i++){let sum=0;for(let j=0;j<size;j++){const v=data[i*size+j]||0;sum+=v*v}const rms=Math.sqrt(sum/size),bar=document.createElement('i');bar.className='bar';bar.style.height=Math.max(3,Math.min(58,4+rms*150))+'px';root.append(bar)}}function setPreset(i){sel=i;const p=defs[i];fontName=p.font;$('fontCards').querySelectorAll('.font-card').forEach(c=>c.classList.toggle('active',c.dataset.font===fontName));document.querySelectorAll('.template').forEach((b,j)=>b.classList.toggle('active',i===j));$('accent').value=colors[i];persist();safeDraw()}defs.forEach((p,i)=>{const b=document.createElement('button');b.className='template';b.textContent=p.name;b.onclick=()=>setPreset(i);$('templates').append(b)});fonts.forEach(f=>{const c=document.createElement('div');c.className='font-card';c.dataset.font=f;c.innerHTML=`<div class="font-name">${f}</div><div class="font-preview" style="font-family:'${f}',sans-serif">สวัสดีครับ · Lyrics</div>`;c.onclick=()=>{fontName=f;$('fontCards').querySelectorAll('.font-card').forEach(x=>x.classList.toggle('active',x===c));persist();safeDraw()};$('fontCards').append(c)});$('lrc').value='[00:00.00]<00:00.00>Welcome <00:01.00>to <00:01.50>Lyrics <00:02.00>Motion';restore();parse($('lrc').value);setPreset(sel);let menuOpen=false;function setMenu(v){menuOpen=!!v;$('menu').classList.toggle('hidden',!menuOpen);$('upload').setAttribute('aria-expanded',String(menuOpen))}$('upload').onclick=e=>{e.stopPropagation();setMenu(!menuOpen)};$('menu').onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-file]');if(!b)return;const id={audio:'audioFile',lrc:'lrcFile',bg:'bgFile'}[b.dataset.file];setMenu(false);$(id).click()};document.addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});$('audioFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;audio.src=URL.createObjectURL(f);$('song').textContent=f.name;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();decoded=await audioCtx.decodeAudioData(await f.arrayBuffer());duration=decoded.duration;bars(decoded);layout()}catch(err){console.warn('Waveform decode unavailable',err)}};$('lrcFile').onchange=e=>{const f=e.target.files?.[0];if(f)f.text().then(t=>{$('lrc').value=t;parse(t)})};$('bgFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f);if(f.type.startsWith('video')){bgVideo=document.createElement('video');bgVideo.src=u;bgVideo.loop=true;bgVideo.muted=true;bgVideo.playsInline=true;bgVideo.play().catch(()=>{});bgImage=null}else{bgImage=new Image();bgImage.src=u;bgImage.onload=safeDraw;bgVideo=null}};$('parse').onclick=()=>parse($('lrc').value);$('play').onclick=()=>audio.paused?audio.play().catch(console.warn):audio.pause();$('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(e.target.value)/1000*audio.duration};$('mute').onclick=()=>{audio.muted=!audio.muted;$('mute').textContent=audio.muted?'Muted':'Sound on'};[['tabStyles','styles','lyrics'],['tabLyrics','lyrics','styles']].forEach(([id,on,off])=>$(id).onclick=()=>{$(on).classList.remove('hidden');$(off).classList.add('hidden');$('tabStyles').classList.toggle('selected',id==='tabStyles');$('tabLyrics').classList.toggle('selected',id==='tabLyrics')});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{canvas.classList.toggle('r916',b.dataset.r==='r916');canvas.classList.toggle('r11',b.dataset.r==='r11');canvas.style.aspectRatio=b.dataset.r==='r916'?'9/16':b.dataset.r==='r11'?'1':'16/9';safeDraw()});[['boxX','x'],['boxY','y']].forEach(([id,key])=>$(id).oninput=()=>{box[key]=Math.max(0,Math.min(100,Number($(id).value)||0));persist();safeDraw()});$('align').onchange=()=>{box.align=$('align').value;persist();safeDraw()};['size','color','accent','bg'].forEach(id=>$(id).oninput=()=>{if(id==='size')$('sizeLabel').textContent=$('size').value;persist();safeDraw()});$('export').onclick=()=>{if(recording){recording.stop();recording=null;return}if(!cv.captureStream||!window.MediaRecorder)return;recording=new MediaRecorder(cv.captureStream(30));const chunks=[];recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=()=>{const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(chunks,{type:recording.mimeType||'video/webm'}));link.download='lyrics-motion.webm';link.click()};recording.start();audio.play().catch(console.warn)};window.addEventListener('resize',layout);requestAnimationFrame(loop)})();</script></body></html>
