:root{--bg:#f1f3f5;--paper:#fff;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--blue:#4f46e5;--soft:#f8fafc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,'IBM Plex Sans Thai',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;transition:.15s}button:hover{background:#f8fafc;border-color:#cbd5e1}button.primary{background:#0f172a;color:white;border-color:#0f172a}button.primary:hover{background:#1e293b}.top{height:58px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}.brand{font-weight:700;font-size:14px;letter-spacing:-.02em}.status{color:#15803d;font-size:11px;margin-left:9px}.status:before{content:'';display:inline-block;width:7px;height:7px;background:#22c55e;border-radius:50%;margin-right:5px}.actions,.toolbar{display:flex;align-items:center;gap:7px}.ratio{padding:6px 8px;color:#475569}.ratio.active{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}.upload{position:relative;overflow:hidden}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.shell{height:calc(100vh - 226px);min-height:440px;display:grid;grid-template-columns:280px minmax(300px,1fr) 280px;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.side{background:white;overflow:auto;padding:15px}.side.right{border:0}.section{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:#64748b;margin:2px 0 12px}.subhead{font-size:12px;font-weight:650;margin:16px 0 9px}.tabs{display:flex;background:#f1f5f9;padding:3px;border-radius:7px;margin-bottom:10px}.tabs button{flex:1;border:0;background:transparent;padding:6px}.tabs button.sel{background:#fff;box-shadow:0 1px 3px #0f172a18}.paste{width:100%;height:70px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:8px}.row{display:flex;align- </style></head><body><header class="top"><div><span class="brand">Lyrics Motion Studio</span><span class="status">Ready</span></div><div class="actions"><button class="ratio active" data-ratio="r169">16:9</button><button class="ratio" data-ratio="r916">9:16</button><button class="ratio" data-ratio="r11">1:1</button><label class="upload"><button>＋ Audio</button><input id="audioFile" type="file" accept="audio/*"></label><button id="export" class="primary">Export</button></div></header>

<script>(()=>{'use strict';const $=s=>document.querySelector(s),audio=$('#audio'),cv=$('#visual'),ctx=cv.getContext('2d'),canvas=$('#canvas'),wave=$('#wave'),track=$('#track');const presets=['Minimalist Pulse','Typewriter & Paper','Kinetic Pop & Snap','Karaoke Glow Fill','Soft Blur & Floating','Dynamic Corner Scatter','Monochrome Glitch Tracking','Celestial Starlight Tunnel','Neon Cyber City','Liquid & Wave','Cosmic Constellation','Particle Dissolve','Mystic Runes & Ancient Gold','Dimension Warp & Z-Drop','Inferno & Ember Sparks','Glassmorphism Hologram','Aura Nebula Cloud','Glitch Overdrive','Shimmering Diamond Dust'];presets.forEach((x,i)=>$('#preset').add(new Option((i+1)+'. '+x,x)));let lines=[{text:'Your mood, your moment',start:0,end:4}],duration=60,selected=0,offset=0,image=null,video=null,animStart=0;
function safe(s){return String(s||'').replace(/\[\d{1,2}:\d{2}(?:\.\d+)?\]/g,'').trim()}function time(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+(v%60).toFixed(2).padStart(5,'0')}function active(){let t=audio.currentTime-offset/1000;return lines.findIndex(l=>t>=l.start&&t<l.end)}function parse(src){let out=[];for(const row of src.split(/\r?\n/)){const ms=[...row.matchAll(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g)],txt=safe(row);if(!txt)continue;for(const m of ms)out.push({text:txt,start:+m[1]*60+ +m[2]+Number('0.'+(m[3]||'0').padEnd(3,'0').slice(0,3)),end:0})}out.sort((a,b)=>a.start-b.start);out.forEach((l,i)=>l.end=out[i+1]?.start||l.start+3);if(!out.length){alert('No timestamped lyric lines found.');return}lines=out;selected=0;drawLines();layoutWave()}
function drawLines(){let root=$('#lines');root.replaceChildren();lines.forEach((l,i)=>{let el=document.createElement('div');el.className='line'+(i===active()?' on':'');el.onclick=()=>{selected=i;audio.currentTime=Math.max(0,l.start+offset/1000);drawLines()};let n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');let box=document.createElement('div'),ta=document.createElement('textarea');ta.rows=2;ta.value=l.text;ta.oninput=()=>{l.text=ta.value;layoutWave()};let times=document.createElement('div');times.className='times';for(const k of ['start','end']){let input=document.createElement('input');input.type='number';input.step='.01';input.value=l[k].toFixed(2);input.onchange=()=>{l[k]=+input.value;layoutWave()};times.append(input)}box.append(ta,times);el.append(n,box);root.append(el)});}
function layoutWave(){let w=Math.max(track.clientWidth,track.clientWidth*3);wave.style.width=w+'px';wave.querySelectorAll('.block').forEach(e=>e.remove());let T=Math.max(duration,...lines.map(l=>l.end),1);lines.forEach((l,i)=>{let b=document.createElement('div');b.className='block';b.textContent=l.text;b.style.left=(l.start/T*w)+'px';b.style.width=Math.max(50,(l.end-l.start)/T*w)+'px';b.onclick=()=>{selected=i;audio.currentTime=l.start;drawLines()};wave.append(b)});$('#waveform').width=w;$('#waveform').height=90;let c=$('#waveform').getContext('2d');c.clearRect(0,0,w,90);c.fillStyle='#94a3b8';for(let x=0;x<w;x+=4){let h=4+Math.abs(Math.sin(x*.09)*Math.sin(x*.017))*25;c.fillRect(x,45-h/2,2,h)}}function update(){let dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.save();ctx.globalAlpha=+$('#opacity').value/100;ctx.filter=`blur(${$('#blur').value}px)`;if(video&&video.readyState>=2)cover(video,w,h);else if(image)cover(image,w,h);else if($('#bgMode').value==='Color'){ctx.fillStyle=$('#bgColor').value;ctx.fillRect(0,0,w,h)}else{let g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,$('#bgColor').value);g.addColorStop(1,'#334155');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}ctx.restore();let i=active(),l=lines[i>=0?i:selected];if(i>=0&&i!==selected){selected=i;drawLines()}if(l){let elapsed=Math.max(0,audio.currentTime-offset/1000-l.start),speed=+$('#speed').value/100,p=Math.min(1,elapsed*speed),preset=$('#preset').value;ctx.save();let x=w/2,y=h/2,scale=1,alpha=1,dy=0;if(preset==='Kinetic Pop & Snap')scale=.8+.2*Math.min(1,p*2);if(preset==='Minimalist Pulse')scale=1+.03*Math.sin(performance.now()/180);if(preset==='Soft Blur & Floating'){alpha=Math.min(1,p*3);dy=Math.sin(performance.now()/400)*7;ctx.filter=`blur(${Math.max(0,4-p*4)}px)`}if(preset==='Dimension Warp & Z-Drop')scale=Math.max(.55,1.5-p*.5);if(preset==='Liquid & Wave')dy=Math.sin(performance.now()/130)*10;ctx.translate(x,y+dy);ctx.scale(scale,scale);let align=$('#align').value;ctx.textAlign=align;ctx.textBaseline='middle';ctx.globalAlpha=alpha;ctx.font=`${$('#weight').value} ${$('#size').value}px "${$('#font').value}", sans-serif`;ctx.letterSpacing=$('#spacing').value+'px';ctx.shadowColor=$('#color').value;ctx.shadowBlur=+$('#glow').value;ctx.fillStyle=$('#color').value;let text=safe(l.text),shown=preset==='Typewriter & Paper'?text.slice(0,Math.ceil(text.length*p)):text;if(preset==='Karaoke Glow Fill'){ctx.fillText(text,0,0);ctx.save();ctx.beginPath();ctx.rect(-w/2,-70,w*p,140);ctx.clip();ctx.fillStyle='#a5b4fc';ctx.fillText(text,0,0);ctx.restore()}else if(preset==='Glitch Overdrive'){ctx.fillStyle='#fb7185';ctx.fillText(shown,-3,0);ctx.fillStyle='#38bdf8';ctx.fillText(shown,3,0)}else ctx.fillText(shown,0,0);ctx.restore()}ctx.filter='none';const total=Math.max(duration,...lines.map(x=>x.end),1),px=audio.currentTime/total*(wave.clientWidth||track.clientWidth);$('#head').style.left=px+'px';$('#clock').textContent=time(audio.currentTime)+' / '+time(duration);$('#scrub').value=duration?audio.currentTime/duration*1000:0;requestAnimationFrame(update)}function cover(src,w,h){let sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight;if(!sw||!sh)return;let fit=$('#fit').value,s=Math.max(w/sw,h/sh);if(fit==='contain')s=Math.min(w/sw,h/sh);let dw=fit==='fill'?w:sw*s,dh=fit==='fill'?h:sh*s;ctx.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh)}
$('#parse').onclick=()=>parse($('#lrcText').value);$('#lrcFile').onchange=async e=>{if(e.target.files[0]){$('#lrcText').value=await e.target.files[0].text();parse($('#lrcText').value)}};$('#tabPaste').onclick=()=>{$('#pastePanel').classList.remove('hidden');$('#uploadPanel').classList.add('hidden')};$('#tabUpload').onclick=()=>{$('#uploadPanel').classList.remove('hidden');$('#pastePanel').classList.add('hidden')};$('#audioFile').onchange=e=>{let f=e.target.files[0];if(!f)return;audio.src=URL.createObjectURL(f);$('#audioName').textContent=f.name;audio.onloadedmetadata=()=>{duration=audio.duration;layoutWave()}};$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='❚❚';audio.onpause=()=>$('#play').textContent='▶';$('#scrub').oninput=e=>audio.currentTime=+e.target.value/1000*duration;$('#volume').oninput=e=>audio.volume=+e.target.value/100;$('#mute').onclick=()=>{audio.muted=!audio.muted;$('#mute').textContent=audio.muted?'🔇':'🔊'};$('#offset').oninput=e=>offset=+e.target.value;$('#add').onclick=()=>{let s=lines.at(-1)?.end||0;lines.push({text:'New lyric',start:s,end:s+3});selected=lines.length-1;drawLines();layoutWave()};document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('active'));b.classList.add('active');canvas.className='canvas'+(b.dataset.ratio==='r169'?'':' '+b.dataset.ratio)});$('#size').oninput=e=>$('#sizeV').textContent=e.target.value;$('#bgMode').onchange=()=>{};$('#bgFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);if(f.type.startsWith('video')){video=document.createElement('video');video.src=u;video.muted=true;video.loop=true;video.play().catch(()=>{});image=null;$('#bgMode').value='Upload Video'}else{image=new Image();image.src=u;video=null;$('#bgMode').value='Upload Image'}};$('#export').onclick=async()=>{if(!cv.captureStream||!window.MediaRecorder){alert('MediaRecorder export is not supported in this browser.');return}const stream=cv.captureStream(60);let audioStream=null;if(audio.src){const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),src=ac.createMediaElementSource(audio),dest=ac.createMediaStreamDestination();src.connect(dest);src.connect(ac.destination);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));audioStream=dest}let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download='lyrics-motion-studio.webm';a.click();audioStream?.stream.getTracks().forEach(t=>t.stop())};rec.start(250);if(audio.src){audio.currentTime=0;await audio.play()}alert('Recording started; press Export again to stop and download.')};let exportButton=$('#export'),recording=false;exportButton.addEventListener('click',()=>{if(recording){} });window.addEventListener('resize',layoutWave);drawLines();layoutWave();requestAnimationFrame(update)})();</script></body></html>
