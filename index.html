$('#export').onclick=()=>{let action=prompt('Export type: video, json, lrc','video');if(!action)return;action=action.toLowerCase();if(action==='json'){download('motion-lyrics-project.json',JSON.stringify({version:1,ratio:canvas.className,background:{preset:bgPreset,color:bgColor,opacity:bgOpacity,blur:bgBlur},preset:currentPreset,lines},null,2),'application/json')}else if(action==='lrc')download('lyrics.lrc',toLrc(),'text/plain');else if(action==='video'||action==='webm'||action==='mp4')exportVideo(action==='mp4')};async function exportVideo(wantMp4){if(!cv.captureStream||!window.MediaRecorder){alert('Video recording is not supported in this browser.');return}let stream=cv.captureStream(60);if(audio.src&&audio.captureStream){audio.captureStream().getAudioTracks().forEach(t=>stream.addTrack(t))}let mime=wantMp4&&MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')?'video/mp4;codecs=avc1':(MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm');if(wantMp4&&!mime.startsWith('video/mp4'))alert('MP4 encoding is unavailable in this browser; exporting WebM instead.');let rec;try{rec=new MediaRecorder(stream,{mimeType:mime})}catch{alert('Could not start browser video encoder.');return}let chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>download('motion-lyrics.'+(mime.startsWith('video/mp4')?'mp4':'webm'),new Blob(chunks,{type:mime}),'video');rec.start(250);if(audio.src){audio.currentTime=0;await audio.play()}let stop=()=>{if(rec.state!=='inactive')rec.stop()};audio.addEventListener('ended',stop,{once:true});setTimeout(stop,Math.max(1000,(duration-audio.currentTime)*1000));alert('Recording started; it will download when playback ends.')}
$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='❚❚';audio.onpause=()=>$('#play').textContent='▶';$('#back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('#forward').onclick=()=>audio.currentTime=Math.min(duration,audio.currentTime+5);audio.onloadedmetadata=()=>{duration=audio.duration;renderTimeline()};$('#delayDown').onclick=()=>{$('#offset').value=offset-=100};$('#delayUp').onclick=()=>{$('#offset').value=offset+=100};$('#offset').onchange=e=>offset=+e.target.value;$('#add').onclick=()=>{let s=lines.at(-1)?.end||0;lines.push({text:'New lyric',start:s,end:s+3,x:50,y:50,preset:currentPreset});selected=lines.length-1;buildLyrics();renderTimeline()};$('#lineMode').onclick=()=>{mode='line';$('#modeLabel').textContent='LINE';$('#lineMode').classList.add('active');$('#wordMode').classList.remove('active')};$('#wordMode').onclick=()=>{mode='word';$('#modeLabel').textContent='WORD';$('#wordMode').classList.add('active');$('#lineMode').classList.remove('active');lines=lines.flatMap(l=>{let words=safeText(l.text).split(/\s+/),step=(l.end-l.start)/Math.max(words.length,1);return words.map((text,i)=>({...l,text,start:l.start+i*step,end:l.start+(i+1)*step}))});selected=0;buildLyrics();renderTimeline()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');canvas.className='canvas '+(b.dataset.r==='r169'?'':b.dataset.r)});$('#zoom').oninput=e=>{zoom=+e.target.value;$('#zoomVal').textContent=zoom+'×';renderTimeline()};$('#textEdit').oninput=e=>{if(lines[selected]){lines[selected].text=safeText(e.target.value);render();let ta=$('#lyrics').querySelectorAll('textarea')[selected];if(ta)ta.value=lines[selected].text}};
$('#uploadBg').onclick=()=>$('#bgFileInput').click();$('#bgFileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);if(f.type.startsWith('video')){if(bgVideo)bgVideo.pause();bgVideo=document.createElement('video');bgVideo.src=u;bgVideo.loop=true;bgVideo.muted=true;bgVideo.playsInline=true;bgVideo.play().catch(()=>{}) ;bgImage=null}else{bgImage=new Image();bgImage.onload=render;bgImage.src=u;bgVideo=null}e.target.value=''};document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bgPreset=b.dataset.bg;bgImage=null;bgVideo=null;if(bgPreset==='obsidian')bgColor='#0b0c10';if(bgPreset==='midnight')bgColor='#0d1117';if(bgPreset==='slate')bgColor='#1e222d';$('#bgColor').value=bgColor});$('#bgColor').oninput=e=>{bgColor=e.target.value;bgPreset='custom'};$('#bgOpacity').oninput=e=>{bgOpacity=+e.target.value/100;$('#opacityVal').textContent=e.target.value+'%'};$('#bgBlur').oninput=e=>{bgBlur=+e.target.value;$('#blurVal').textContent=bgBlur+'px'};$('#fontSize').oninput=render;$('#glow').oninput=render;$('#color').oninput=render;
function dragStart(e){let r=cv.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,l:lines[selected]?.x||50,t:lines[selected]?.y||50,w:r.width,h:r.height};cv.setPointerCapture(e.pointerId)}cv.onpointerdown=dragStart;cv.onpointermove=e=>{if(!drag||!lines[selected])return;lines[selected].x=Math.max(3,Math.min(97,drag.l+(e.clientX-drag.x)/drag.w*100));lines[selected].y=Math.max(3,Math.min(97,drag.t+(e.clientY-drag.y)/drag.h*100));$('#coords').textContent=`${Math.round(lines[selected].x)}%, ${Math.round(lines[selected].y)}%`};cv.onpointerup=()=>drag=null;track.onpointerdown=e=>{if(e.target.classList.contains('block'))return;track.setPointerCapture(e.pointerId);scrub(e)};track.onpointermove=e=>{if(e.buttons)scrub(e)};function scrub(e){let r=track.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(duration,(e.clientX-r.left+track.scrollLeft)/inner.clientWidth*total()))}window.addEventListener('resize',renderTimeline);buildLyrics();renderTimeline();requestAnimationFrame(draw)
