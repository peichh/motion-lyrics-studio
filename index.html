<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Lyrics Studio</title><style>
:root{--bg:#0a0b10;--panel:#12131a;--line:#292b35;--gold:#e1bd4b;--muted:#9396a4;--fg:#f7f4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{background:#1c1e27;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}button:hover,button.active{border-color:var(--gold);color:var(--gold)}header{height:58px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;background:#101116;border-bottom:1px solid var(--line)}.brand{color:var(--gold);font-weight:800;letter-spacing:.12em}.controls,.ratios{display:flex;align-items:center;gap:5px}.layout{height:calc(100vh - 228px);min-height:440px;display:grid;grid-template-columns:285px 1fr 280px}.panel{overflow:auto;background:var(--panel);padding:12px;border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);border-right:0}.section{margin-bottom:16px}.section h3{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:3px 0 9px}.row{display:flex;align-items:center;gap:7px;margin:7px 0}.row label{flex:1;color:#c3c5ce}input,textarea,select{background:#0b0c12;border:1px solid var(--line);border-radius:5px;padding:6px;min-width:0}input[type=range]{accent-color:var(--gold);width:110px}input[type=number]{width:75px}.lyric{padding:7px 3px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:30px 1fr;gap:6px}.lyric.selected{background:#272315;border-left:2px solid var(--gold)}.lyric textarea{width:100%;resize:vertical}.workspace{display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse,#1b1c25,#0b0c10 75%)}.canvas{position:relative;width:min(94%,900px);aspect-ratio:16/9;max-height:94%;overflow:hidden;background:#090b12;box-shadow:0 20px 60px #0009;contain:layout paint}.canvas.r916{aspect-ratio:9/16;width:auto;height:min(94%,640px)}.canvas.r11{aspect-ratio:1;width:auto;height:min(94%,640px)}.canvas.r45{aspect-ratio:4/5;width:auto;height:min(94%,640px)}#visual{position:absolute;inset:0;width:100%;height:100%}.dragtext{position:absolute;left:50%;top:50%;transform:translate3d(-50%,-50%,0);max-width:88%;text-align:center;white-space:pre-wrap;font-size:54px;font-weight:850;cursor:move;touch-action:none;user-select:none;will-change:transform,opacity,filter;z-index:2}.dragtext.focus{outline:1px dashed var(--gold);outline-offset:12px}.timeline{height:170px;background:#101116;border-top:1px solid var(--line);padding:11px 14px}.timehead{display:flex;justify-content:space-between;align-items:center}.track{height:74px;position:relative;margin-top:12px;border:1px solid var(--line);overflow:auto hidden;background:repeating-linear-gradient(90deg,#20222a 0 1px,transparent 1px 48px);touch-action:pan-y}.trackInner{height:100%;position:relative}.block{position:absolute;top:15px;height:39px;background:#352d14;border:1px solid var(--gold);border-radius:4px;white-space:nowrap;overflow:hidden;padding:9px 5px;font-size:11px;cursor:pointer}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff6464;pointer-events:none;will-change:transform;z-index:3}.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}.presets button{font-size:10px;text-align:left;padding:7px}.preset-list{max-height:225px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}.tag{color:var(--gold);font-size:10px}.muted{color:var(--muted)}.export{background:var(--gold);color:#15120a;font-weight:800}@media(max-width:960px){.layout{grid-template-columns:235px 1fr;height:calc(100vh - 228px)}.right{display:none}}@media(max-width:650px){header{height:auto;flex-wrap:wrap;padding:8px}.layout{display:flex;flex-direction:column;height:auto}.panel.left{max-height:230px}.workspace{min-height:350px}.timeline{height:170px}}
</style></head><body><header><div class="brand">LYRICS STUDIO / MOTION WORKSPACE</div><div class="controls"><button id="play">▶</button><button id="back">↶</button><button id="fwd">↷</button><button id="loop" class="active">↻</button><span id="clock">00:00.00 / 00:00.00</span></div><div class="ratios"><button data-r="r169" class="active">16:9</button><button data-r="r916">9:16</button><button data-r="r11">1:1</button><button data-r="r45">4:5</button></div></header><main class="layout"><aside class="panel left"><section class="section"><h3>Audio / Sync</h3><input id="audioFile" type="file" accept="audio/*"><div id="audioStatus" class="muted"></div><div class="row"><label>Global delay ms</label><button id="minus">−</button><input id="offset" type="number" step="100" value="0"><button id="plus">＋</button></div><div class="row"><button id="add">＋ Lyric</button><button id="lineMode" class="active">Line</button><button id="wordMode">Word</button></div></section><section class="section"><h3>Lyrics & timing</h3><div id="lyrics"></div></section></aside><section class="workspace"><div class="canvas" id="canvas"><canvas id="visual"></canvas><div class="dragtext focus" id="lyricText">Add a lyric to begin</div></div></section><aside class="panel right"><section class="section"><h3>Preset selector · 19 styles</h3><div id="presetList" class="preset-list"></div></section><section class="section"><h3>Selected lyric inspector</h3><div class="row"><label>Text</label><input id="textEdit"></div><div class="row"><label>Font size</label><input id="fontSize" type="range" min="18" max="120" value="56"></div><div class="row"><label>Color</label><input id="color" type="color" value="#fff3cc"></div><div class="row"><label>Glow</label><input id="glow" type="range" min="0" max="45" value="18"></div><div class="row"><label>Rotation</label><input id="rotation" type="range" min="-30" max="30" value="0"></div><div class="row"><label>Position</label><span id="coords" class="muted">50%, 50%</span></div><div class="row"><label>Timeline zoom</label><input id="zoom" type="range" min="1" max="10" value="3"><span id="zoomLabel">3×</span></div></section></aside></main><section class="timeline"><div class="timehead"><b>PRO TIMELINE · <span id="modeLabel">LINE</span></b><span class="muted">Drag to scrub · wheel/slider to zoom</span></div><div class="track" id="track"><div class="trackInner" id="trackInner"><div class="playhead" id="playhead"></div></div></div></section><audio id="audio" hidden></audio><script>
(()=>{'use strict';const $=s=>document.querySelector(s),audio=$('#audio'),canvas=$('#canvas'),text=$('#lyricText'),track=$('#track'),inner=$('#trackInner'),head=$('#playhead'),ctx=$('#visual').getContext('2d',{alpha:false});const catalog=[['Classic / Modern','Minimalist Pulse','Typewriter & Paper','Kinetic Pop & Snap','Karaoke Glow Fill','Soft Blur & Floating','Dynamic Corner Scatter','Monochrome Glitch Tracking'],['Fantasy / 3D','Celestial Starlight Tunnel','Neon Cyber City','Liquid & Wave','Cosmic Constellation','Particle Dissolve','Mystic Runes & Ancient Gold','Dimension Warp & Z-Drop','Inferno & Ember Sparks','Glassmorphism Hologram','Aura Nebula Cloud','Glitch Overdrive','Shimmering Diamond Dust']];let lines=[{text:'Your mood, your moment',start:0,end:4,x:50,y:50,preset:'Minimalist Pulse'}],selected=0,mode='line',duration=60,zoom=3,loop=true,currentPreset=catalog[0][1],ratio='r169',drag=null,lastActive=-2,bgHue=0;
const presets=$('#presetList');catalog.forEach(([category,...names])=>{const h=document.createElement('h4');h.textContent=category;h.className='tag';presets.append(h);const box=document.createElement('div');box.className='presets';names.forEach(name=>{const b=document.createElement('button');b.textContent=name;b.dataset.preset=name;b.onclick=()=>applyPreset(name);box.append(b)});presets.append(box)});
function applyPreset(name){currentPreset=name;const line=lines[selected];if(line)line.preset=name;presets.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));sync(true)}
function activeIndex(){const t=audio.currentTime-(+$('#offset').value/1000);return lines.findIndex(l=>t>=l.start&&t<l.end)}function totalTime(){return Math.max(duration,...lines.map(l=>l.end),1)}function setLine(i){if(i<0||i>=lines.length)return;selected=i;currentPreset=lines[i].preset||currentPreset;$('#textEdit').value=lines[i].text;$('#coords').textContent=`${Math.round(lines[i].x)}%, ${Math.round(lines[i].y)}%`;$('#lyrics').querySelectorAll('.lyric').forEach((el,j)=>el.classList.toggle('selected',j===i));presets.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.preset===currentPreset));renderTimeline();sync(true)}
function buildLyrics(){const host=$('#lyrics');host.replaceChildren();lines.forEach((l,i)=>{const row=document.createElement('div');row.className='lyric'+(i===selected?' selected':'');const num=document.createElement('small');num.textContent=String(i+1).padStart(2,'0');const content=document.createElement('div'),ta=document.createElement('textarea');ta.rows=2;ta.value=l.text;ta.oninput=()=>{l.text=ta.value;if(i===selected)sync(false);const block=inner.querySelector(`[data-i="${i}"]`);if(block)block.textContent=l.text};const fields=document.createElement('div');fields.className='row';const start=document.createElement('input'),end=document.createElement('input'),syncBtn=document.createElement('button');[start,end].forEach(n=>{n.type='number';n.step='.01';n.style.width='72px'});start.value=l.start;end.value=l.end;start.onchange=()=>{l.start=+start.value;renderTimeline()};end.onchange=()=>{l.end=+end.value;renderTimeline()};syncBtn.textContent='Sync';syncBtn.onclick=()=>{l.start=Math.max(0,audio.currentTime-(+$('#offset').value/1000));l.end=l.start+2;start.value=l.start;end.value=l.end;renderTimeline()};fields.append(start,end,syncBtn);content.append(ta,fields);row.append(num,content);row.onclick=()=>{if(selected!==i){setLine(i);audio.currentTime=Math.max(0,l.start+(+$('#offset').value/1000))}};host.append(row)})}
function renderTimeline(){const w=Math.max(track.clientWidth,track.clientWidth*zoom),total=totalTime();inner.style.width=w+'px';inner.style.height='100%';inner.querySelectorAll('.block').forEach(e=>e.remove());lines.forEach((l,i)=>{const b=document.createElement('div');b.className='block';b.dataset.i=i;b.style.left=(l.start/total*w)+'px';b.style.width=Math.max(48,(l.end-l.start)/total*w)+'px';b.textContent=l.text;b.style.borderColor=i===selected?'#f3d35e':'#9a7b30';b.onclick=e=>{e.stopPropagation();setLine(i)};inner.append(b)});tick()}
function tick(){const t=audio.currentTime,total=totalTime(),w=inner.clientWidth||track.clientWidth;head.style.transform=`translate3d(${Math.min(w,t/total*w)}px,0,0)`;$('#clock').textContent=`${fmt(t)} / ${fmt(duration)}`}
function fmt(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`}
function sync(force){const active=activeIndex();if(active>=0&&active!==lastActive){lastActive=active;if(active!==selected){selected=active;const line=lines[selected];$('#textEdit').value=line.text;$('#coords').textContent=`${Math.round(line.x)}%, ${Math.round(line.y)}%`;$('#lyrics').querySelectorAll('.lyric').forEach((el,j)=>el.classList.toggle('selected',j===selected));currentPreset=line.preset||currentPreset;presets.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.preset===currentPreset))}}const l=lines[selected];if(l){text.textContent=l.text;text.style.left=l.x+'%';text.style.top=l.y+'%';text.style.color=$('#color').value;text.style.fontSize=$('#fontSize').value+'px';text.style.textShadow=`0 0 ${$('#glow').value}px ${$('#color').value}`;text.style.transform=`translate3d(-50%,-50%,0) rotate(${$('#rotation').value}deg) ${motionTransform(currentPreset,audio.currentTime-l.start)}`;text.style.opacity=motionOpacity(currentPreset,audio.currentTime-l.start);text.style.filter=currentPreset==='Soft Blur & Floating'?`blur(${Math.max(0,5-(audio.currentTime-l.start)*3)}px)`:'none';text.classList.toggle('focus',!audio.paused||document.activeElement===text);if(force)text.style.willChange='transform,opacity,filter'}tick()}
function motionTransform(n,t){if(n==='Kinetic Pop & Snap'){const p=Math.min(1,t/.55),spring=1+Math.exp(-6*p)*Math.cos(11*p)*.15;return `scale(${t<.55?.8+.35*p:spring})`}if(n==='Minimalist Pulse')return `scale(${1+Math.sin(t*8)*.025})`;if(n==='Dimension Warp & Z-Drop')return `perspective(700px) translateZ(${Math.max(-180,180-t*320)}px) rotateX(${Math.max(0,18-t*28)}deg)`;if(n==='Liquid & Wave')return `translate3d(0,${Math.sin(t*5)*5}px,0) skewX(${Math.sin(t*3)*3}deg)`;if(n==='Neon Cyber City'||n==='Glitch Overdrive'||n==='Monochrome Glitch Tracking')return `translate3d(${Math.sin(t*31)*2}px,${Math.cos(t*27)*1}px,0)`;if(n==='Dynamic Corner Scatter')return `translate3d(0,${Math.max(0,1-t)*24}px,0) scale(${.9+Math.min(1,t)*.1})`;if(n==='Celestial Starlight Tunnel')return `perspective(500px) translateZ(${Math.sin(t*2)*22}px) scale(${1+Math.sin(t*2)*.02})`;return 'translate3d(0,0,0)'}function motionOpacity(n,t){if(n==='Particle Dissolve')return Math.min(1,Math.max(0,(lines[selected]?.end-audio.currentTime)*2));if(n==='Typewriter & Paper')return 1;return 1}
function background(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2),cw=Math.round(w*dpr),ch=Math.round(h*dpr);if(ctx.canvas.width!==cw||ctx.canvas.height!==ch){ctx.canvas.width=cw;ctx.canvas.height=ch}ctx.setTransform(dpr,0,0,dpr,0,0);let p=currentPreset;let g=ctx.createLinearGradient(0,0,w,h);if(p==='Neon Cyber City'||p==='Glitch Overdrive'){g.addColorStop(0,'#071627');g.addColorStop(1,'#260c31')}else if(p==='Inferno & Ember Sparks'){g.addColorStop(0,'#42120d');g.addColorStop(1,'#100808')}else if(p==='Aura Nebula Cloud'||p==='Celestial Starlight Tunnel'||p==='Cosmic Constellation'){g.addColorStop(0,'#1b1338');g.addColorStop(1,'#070911')}else{g.addColorStop(0,'#182333');g.addColorStop(1,'#090a11')}ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const count=p==='Celestial Starlight Tunnel'?110:(p==='Shimmering Diamond Dust'||p==='Inferno & Ember Sparks'||p==='Particle Dissolve'?65:30);const time=performance.now()*.001;for(let i=0;i<count;i++){let x=((i*137.51+time*(p==='Inferno & Ember Sparks'?8:2)*(i%3+1))%w+w)%w;let y=((i*89.7+(p==='Inferno & Ember Sparks'?-time*24:time*2))%h+h)%h;ctx.fillStyle=p==='Neon Cyber City'?'rgba(0,238,255,.28)':p==='Inferno & Ember Sparks'?'rgba(255,145,36,.75)':'rgba(232,205,116,.55)';let r=p==='Shimmering Diamond Dust'?2.2:1.2;ctx.fillRect(x,y,r,r)}if(p==='Neon Cyber City'){ctx.fillStyle='rgba(0,245,255,.12)';for(let y=0;y<h;y+=5)ctx.fillRect(0,y,w,1)}requestAnimationFrame(background)}
function scrub(e){const r=track.getBoundingClientRect(),fraction=Math.max(0,Math.min(1,(e.clientX-r.left+track.scrollLeft)/inner.clientWidth));audio.currentTime=fraction*totalTime();sync(false)}track.onpointerdown=e=>{if(e.target.classList.contains('block'))return;track.setPointerCapture(e.pointerId);scrub(e)};track.onpointermove=e=>{if(e.buttons)scrub(e)};$('#zoom').oninput=e=>{zoom=+e.target.value;$('#zoomLabel').textContent=zoom+'×';renderTimeline()};track.onwheel=e=>{if(e.ctrlKey){e.preventDefault();zoom=Math.max(1,Math.min(10,zoom+(e.deltaY<0?1:-1)));$('#zoom').value=zoom;$('#zoomLabel').textContent=zoom+'×';renderTimeline()} };
$('#audioFile').onchange=e=>{const f=e.target.files[0];if(f){audio.src=URL.createObjectURL(f);audio.onloadedmetadata=()=>{duration=audio.duration;$('#audioStatus').textContent=f.name;renderTimeline()}}};$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='❚❚';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>sync(false);audio.onended=()=>{if(loop){audio.currentTime=0;audio.play()}};$('#back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('#fwd').onclick=()=>audio.currentTime=Math.min(duration,audio.currentTime+5);$('#loop').onclick=e=>{loop=!loop;e.currentTarget.classList.toggle('active',loop)};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');canvas.className='canvas '+(b.dataset.r==='r169'?'':b.dataset.r);ratio=b.dataset.r;renderTimeline()});$('#minus').onclick=()=>{$('#offset').value=+$('#offset').value-100;sync(true)};$('#plus').onclick=()=>{$('#offset').value=+$('#offset').value+100;sync(true)};$('#offset').onchange=()=>sync(true);$('#add').onclick=()=>{let s=lines.at(-1)?.end||0;lines.push({text:'New lyric',start:s,end:s+3,x:50,y:50,preset:currentPreset});selected=lines.length-1;buildLyrics();setLine(selected)};function setMode(m){mode=m;$('#modeLabel').textContent=m.toUpperCase();$('#lineMode').classList.toggle('active',m==='line');$('#wordMode').classList.toggle('active',m==='word');if(m==='word')lines=lines.flatMap(l=>{const a=l.text.split(/\s+/),step=(l.end-l.start)/Math.max(a.length,1);return a.map((word,i)=>({...l,text:word,start:l.start+i*step,end:l.start+(i+1)*step}))});buildLyrics();renderTimeline()}$('#lineMode').onclick=()=>setMode('line');$('#wordMode').onclick=()=>setMode('word');
text.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,l:lines[selected].x,t:lines[selected].y};text.setPointerCapture(e.pointerId)};text.onpointermove=e=>{if(!drag)return;const r=canvas.getBoundingClientRect(),l=lines[selected];l.x=Math.max(3,Math.min(97,drag.l+(e.clientX-drag.x)/r.width*100));l.y=Math.max(3,Math.min(97,drag.t+(e.clientY-drag.y)/r.height*100));$('#coords').textContent=`${Math.round(l.x)}%, ${Math.round(l.y)}%`;text.style.left=l.x+'%';text.style.top=l.y+'%'};text.onpointerup=()=>drag=null;$('#textEdit').oninput=e=>{lines[selected].text=e.target.value;text.textContent=e.target.value;const b=inner.querySelector(`[data-i="${selected}"]`);if(b)b.textContent=e.target.value;const ta=$('#lyrics').querySelectorAll('textarea')[selected];if(ta)ta.value=e.target.value};[['fontSize','input'],['color','input'],['glow','input'],['rotation','input']].forEach(([id,ev])=>$('#'+id).addEventListener(ev,()=>sync(true)));$('#color').oninput=()=>{text.style.color=$('#color').value;text.style.textShadow=`0 0 ${$('#glow').value}px ${$('#color').value}`};
function ensureActive(){const a=activeIndex();if(a>=0&&a!==lastActive){lastActive=a;if(a!==selected)setLine(a)}}function frame(){ensureActive();sync(false);requestAnimationFrame(frame)}function init(){buildLyrics();setLine(0);renderTimeline();requestAnimationFrame(background);requestAnimationFrame(frame)}init();
})();</script></body></html>
